<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/axios/1.7.6/axios.min.js"></script>
</head>
<body>
    <input type="text" id="a" placeholder="first value"></input>
    <input type="text" id="b" placeholder="second value"></input>
    <button onclick="sendRequest()">Find sum</button>
    <script>
        async function sendRequest(){
            const response = await axios.post("http://localhost:3001/postsum", {
                a: document.getElementById("a").value,
                b: document.getElementById("b").value,
            })
            console.log(response.data);
        }
    </script>
</body>
</html>
